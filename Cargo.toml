[package]
name = "edge-touch"
version = "0.1.0"
edition = "2021"
description = "Menu bar driver that makes the Corsair XENEON Edge a real touchscreen on macOS"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
tao = "0.37"
tray-icon = "0.25"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
